name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macOS arm64
          - runner: ubuntu-24.04
            platform: Linux amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci
      - run: npm test
      - run: go vet ./apps/backend/...
      - run: npm run build
      - if: runner.os == 'Linux'
        name: Audit production dependencies
        shell: bash
        run: |
          audit_json="$RUNNER_TEMP/npm-audit.json"
          audit_error="$RUNNER_TEMP/npm-audit-error.log"
          for attempt in 1 2 3; do
            if npm audit --audit-level=high --fetch-timeout=60000 --json >"$audit_json" 2>"$audit_error"; then
              exit 0
            fi

            set +e
            node - "$audit_json" <<'NODE'
          const fs = require("node:fs");
          try {
            const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const counts = report.metadata?.vulnerabilities;
            if (!counts) process.exit(2);
            process.exit((Number(counts.high) || 0) + (Number(counts.critical) || 0) > 0 ? 1 : 2);
          } catch {
            process.exit(2);
          }
          NODE
            report_status=$?
            set -e
            if [ "$report_status" -eq 1 ]; then
              cat "$audit_json"
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning::npm audit service remained unavailable after 3 attempts; local audit or a later CI run is required"
              cat "$audit_error"
              exit 0
            fi
            echo "npm audit service unavailable; retrying ($attempt/3)"
            sleep 5
          done
      - name: Smoke-test release installer
        if: runner.os == 'Linux'
        run: |
          install_dir="$(mktemp -d)"
          TERMLINKS_INSTALL_DIR="$install_dir" ./install.sh
          "$install_dir/termlinks" version

  race:
    name: Go race detector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache-dependency-path: apps/backend/go.sum
      - run: go -C apps/backend test -race ./...
