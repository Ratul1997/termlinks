name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macOS arm64
          - runner: ubuntu-24.04
            platform: Linux amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache-dependency-path: apps/backend/go.sum
      - run: npm ci
      - run: npm test
      - run: go vet ./apps/backend/...
      - run: npm run build
      - if: runner.os == 'Linux'
        name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high --fetch-timeout=60000; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm audit service unavailable; retrying ($attempt/3)"
            sleep 5
          done
      - name: Smoke-test release installer
        if: runner.os == 'Linux'
        run: |
          install_dir="$(mktemp -d)"
          TERMLINKS_INSTALL_DIR="$install_dir" ./install.sh
          "$install_dir/termlinks" version

  race:
    name: Go race detector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache-dependency-path: apps/backend/go.sum
      - run: go -C apps/backend test -race ./...
