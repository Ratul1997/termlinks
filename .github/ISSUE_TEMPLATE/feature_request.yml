name: Feature request
description: Propose a focused improvement to local-first terminal continuity.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior rather than prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Local-first and security impact
      description: What new data, permission, network exposure, or remote action would this require?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Primary platform
      options:
        - All supported platforms
        - macOS
        - Linux
        - Windows (future support)
        - Web/PWA only
    validations:
      required: true
